server:
  port: 8080

spring:
  application:
    name: ticketmaster-concurrent
  
  profiles:
    active: local

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/ticketmaster_db
    
  jpa:
    hibernate:
      ddl-auto: validate 
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    
  cache:
    type: simple

app:
  jwt:
    expiration-ms: 86400000